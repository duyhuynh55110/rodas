name: Deploy Image, Update container, Cloudfront distribution

on:
  push:
    branches:
      - develop
      - master
      - feature/cicd_deloy_aws

permissions:
  id-token: write
  contents: read

env:
  APP_ENV: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
  AWS_REGION: ap-southeast-1

  # ECS configuration
  ECS_SERVICE: service-server
  ECS_CLUSTER: cluster

  # Admin
  ADMIN_ECR: rodas/admin
  ADMIN_CONTAINER: rodas-admin

  # Server (Nginx)
  SERVER_ECR: rodas/server
  SERVER_CONTAINER: rodas-server

  # CloudFront and S3
  USER_ASSETS_BUCKET: your-user-assets-bucket
  # CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Notify deployment start
        run: |
          source .github/workflows/scripts/slack_notify.sh
          send_slack_notification "#2b6cb0" "🚀" "In Progress" "Building and pushing image..."
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APP_ENV: "production"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-to-assume: 123213
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check for admin changes
        id: admin-changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -v '^resources/assets/user' | grep -v '^\.github/' | grep -q .; then
            echo "admin_changed=true" >> $GITHUB_OUTPUT
          else
            echo "admin_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for user assets changes
        id: user-changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^resources/assets/user' > /dev/null; then
            echo "user_changed=true" >> $GITHUB_OUTPUT
          else
            echo "user_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for nginx changes
        id: nginx-changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^docker/' > /dev/null; then
            echo "nginx_changed=true" >> $GITHUB_OUTPUT
          else
            echo "nginx_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify deployment failure
        if: failure()
        shell: bash
        run: |
          source <(declare -f send_slack_notification)
          send_slack_notification "#dc2626" "❌" "Failed" "Build or push failed"
